name: Build CataclysmMiner

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Paper 1.20.1 / Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"

      - name: Show Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build CataclysmMiner
        run: gradle clean build --no-daemon

      - name: Check JAR
        run: |
          echo "Checking build/libs..."
          ls -lah build/libs/
          test -f build/libs/CataclysmMiner.jar

      - name: Upload CataclysmMiner.jar
        uses: actions/upload-artifact@v4
        with:
          name: CataclysmMiner
          path: build/libs/CataclysmMiner.jar
          if-no-files-found: error
          retention-days: 30
