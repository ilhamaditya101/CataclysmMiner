name: Build CataclysmMiner

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Paper 1.20.1 / Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          test -f build/libs/CataclysmMiner.jar
          echo "Build OK:"
          ls -lh build/libs/CataclysmMiner.jar

      - name: Upload CataclysmMiner.jar
        uses: actions/upload-artifact@v4
        with:
          name: CataclysmMiner
          path: build/libs/CataclysmMiner.jar
          if-no-files-found: error
          retention-days: 30
